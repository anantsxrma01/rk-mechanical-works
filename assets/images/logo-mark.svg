  <rect width="78" height="78" x="1" y="1" rx="17" stroke="url(#markCyanGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Precision Monogram Symbol -->
  <g transform="translate(5, 5)">
    <!-- R structure -->
    <path d="M19 18 L33 18 C39.5 18 44 21.5 44 27 C44 32.5 39.5 36 33 36 L26 36 L26 52 L19 52 Z" fill="url(#markCyanGrad)"/>
    <path d="M26 24 L32.5 24 C35 24 37 25.2 37 27 C37 28.8 35 30 32.5 30 L26 30 Z" fill="#001428"/>
    <!-- K chevron struts -->
    <path d="M35 35 L49 18 L58 18 L42 36 L60 52 L50 52 L36 38 Z" fill="#00E5FF"/>
