<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 42" fill="none">
  <defs>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00C0F0" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#35E8FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Pure Typographic Brand Stack: Equal Length & Close Proximity -->
  <g transform="translate(0, 6)">
    <!-- Top Line: RK • MECHANICAL -->
    <text x="0" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">
      RK
    </text>
    
    <!-- Glowing Cyan Dot with 360-deg blur shadow -->
    <circle cx="37" cy="13" r="2.8" fill="#00C0F0" filter="url(#dotGlow)"/>

    <!-- MECHANICAL with reduced boldness (font-weight: 400) -->
    <text x="47" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="0.05em" fill="#FFFFFF">
      MECHANICAL
    </text>

    <!-- Bottom Line: Exactly equal horizontal length (textLength="166"), positioned close underneath (y="28.5") -->
    <text x="0" y="28.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#00A3E0" textLength="166" lengthAdjust="spacing">
      WORKS PRIVATE LIMITED
    </text>
  </g>
</svg>
