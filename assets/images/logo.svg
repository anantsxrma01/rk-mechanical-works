<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" fill="none">
  <defs>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00C0F0" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#35E8FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Pure Typographic Brand Stack -->
  <g transform="translate(0, 8)">
    <!-- Top Line: RK • MECHANICAL -->
    <!-- RK in heavy bold -->
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">
      RK
    </text>
    
    <!-- Glowing Cyan Dot with blur shadow -->
    <circle cx="39" cy="14" r="3" fill="#00C0F0" filter="url(#dotGlow)"/>

    <!-- MECHANICAL with reduced boldness (font-weight: 400) -->
    <text x="49" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="0.05em" fill="#FFFFFF">
      MECHANICAL
    </text>

    <!-- Bottom Line: WORKS PRIVATE LIMITED in tracked small font -->
    <text x="0.5" y="34" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.18em" fill="#00A3E0">
      WORKS PRIVATE LIMITED
    </text>
  </g>
</svg>
